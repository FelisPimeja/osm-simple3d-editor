<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSM Simple 3D Editor</title>
</head>
<body>
  <div id="map"></div>
  <div id="popup"></div>
  <div id="mobile-card" hidden></div>
  <div id="date-panel" hidden>
    <div class="dp-row">
      <button type="button" class="dp-btn" data-back title="Шаг назад">⏮</button>
      <button type="button" class="dp-btn dp-play" data-play title="Воспроизвести"></button>
      <button type="button" class="dp-btn" data-fwd title="Шаг вперёд">⏭</button>
      <input id="date-year" class="dp-year" type="number" step="1" title="Текущий год: показываются объекты, существовавшие в нём (start_date … end_date). До н. э. — со знаком минус" />
      <label class="dp-opt" title="Шаг воспроизведения">шаг <select id="date-step"><option value="1">1 год</option><option value="5">5 лет</option><option value="10">10 лет</option><option value="25">25 лет</option><option value="50">50 лет</option><option value="100">100 лет</option></select></label>
      <label class="dp-opt" title="Скорость воспроизведения: пауза между шагами">каждые <select id="date-speed"><option value="500">0,5 с</option><option value="1000">1 с</option><option value="2000">2 с</option><option value="4000">4 с</option></select></label>
    </div>
    <div class="dp-row">
      <input id="date-from" class="dp-bound" type="number" step="1" title="Начало шкалы" />
      <input id="date-slider" class="dp-slider" type="range" step="1" aria-label="Текущий год" />
      <input id="date-to" class="dp-bound" type="number" step="1" title="Конец шкалы" />
    </div>
  </div>
  <div id="op-indicator" hidden><span class="dot"></span><span class="label"></span><button type="button" class="retry" hidden>Повторить</button></div>
  <div id="left-col" class="col">
  <aside id="panel" class="panel">
    <header class="panel-head"><h1>OSM Simple 3D</h1><button type="button" class="collapse-btn" title="Свернуть" aria-expanded="true"></button></header>
    <div class="panel-body">
    <label class="server-line">Сервер <select id="server-select" title="Откуда загружать данные для редактирования и куда отправлять"></select></label>
    <label class="toggle"><input id="mono-toggle" type="checkbox" /> Убрать цвета</label>
    <label class="toggle" title="Правая или средняя кнопка мыши, либо Ctrl + левая"><input id="orbit-toggle" type="checkbox" /> Вращение вокруг точки под курсором</label>
    <details id="gfx" class="gfx">
      <summary>Настройки графики</summary>
      <label class="toggle"><input type="checkbox" data-gfx="antialias" /> Сглаживание <span class="hint">(перезагрузит страницу)</span></label>
      <label class="toggle"><input type="checkbox" data-gfx="hemisphere" /> Полусферический свет</label>
      <label class="toggle"><input type="checkbox" data-gfx="groundAO" /> Затемнение у земли</label>
      <label class="toggle"><input type="checkbox" data-gfx="edges" /> Контуры рёбер</label>
      <label class="toggle"><input type="checkbox" data-gfx="noGlass" /> Выключить стёкла</label>
      <label class="toggle" title="У зданий и частей без height и building:levels — стены 3,5 м по умолчанию; выключено — плоский след (на своём min_height)"><input type="checkbox" data-gfx="defaultHeight" /> Поднимать здания с дефолтной высотой</label>
      <p class="hint cache-line"><span id="cache-info">Кэш тайлов: —</span> <button id="cache-clear" type="button">Очистить</button></p>
      <p class="hint cache-line"><button id="tiles-reload" type="button" title="Отладка: заново запросить из OSM API тайлы на экране">Перезагрузить видимые тайлы</button></p>
      <p id="perf" class="hint">FPS: — · треугольников: —</p>
    </details>
    <p id="status" class="hint">Приблизьте карту (z ≥ 15) и кликните по зданию.</p>
    </div>
  </aside>
  <!-- Вертикальные панели инструментов (режим здания и др.) -->
  <div id="toolbars">
    <div id="map-tools" class="toolbar">
      <button type="button" data-tool="rect" title="Новое здание: прямоугольник (R, Tab — способ построения)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3.5 6h13v8h-13z"/><circle cx="3.5" cy="6" r="1.3" fill="currentColor"/><circle cx="16.5" cy="14" r="1.3" fill="currentColor"/></svg></button>
      <button type="button" data-tool="polygon" title="Новое здание: полигон (L)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 15l-1-7 6-5 8 4-2 8z"/><circle cx="4" cy="15" r="1.3" fill="currentColor"/><circle cx="9" cy="3" r="1.3" fill="currentColor"/><circle cx="17" cy="7" r="1.3" fill="currentColor"/></svg></button>
      <button type="button" data-tool="circle" title="Круг: новое здание (C)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="1.2" fill="currentColor"/></svg></button>
      <button type="button" data-tool="ngon" title="Правильный многоугольник: новое здание (N)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M10 3l6.1 3.5v7L10 17l-6.1-3.5v-7z"/><circle cx="10" cy="10" r="1.2" fill="currentColor"/></svg></button>
      <div class="toolbar-sep"></div>
      <button type="button" data-help title="Помощь по инструменту (показать или скрыть)">?</button>
    </div>
    <div id="focus-tools" class="toolbar" hidden>
      <button type="button" data-tool="move" title="Переместить (M)">✥</button>
      <button type="button" data-tool="rotate" title="Повернуть вокруг вертикальной оси (Q)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M15.5 6.5A6.5 6.5 0 1 0 16.5 11"/><path d="M15.8 2.8v4h-4"/><circle cx="10" cy="10" r="1.2" fill="currentColor"/></svg></button>
      <button type="button" data-tool="push" title="Вытянуть: высота верха или низа (P)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M3 13l7 3.5 7-3.5-7-3.5z"/><path d="M10 9.5V2.5M7.5 5L10 2.5 12.5 5"/></svg></button>
      <button type="button" data-tool="split" title="Рассечь верхнюю грань (K)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M3 5h14v10H3z"/><path d="M8 3.5l4 13" stroke-dasharray="2 1.6"/></svg></button>
      <button type="button" data-tool="rect" title="Прямоугольник: новая часть (R, Tab — способ построения)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3.5 6h13v8h-13z"/><circle cx="3.5" cy="6" r="1.3" fill="currentColor"/><circle cx="16.5" cy="14" r="1.3" fill="currentColor"/></svg></button>
      <button type="button" data-tool="polygon" title="Полигон: новая часть (L)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 15l-1-7 6-5 8 4-2 8z"/><circle cx="4" cy="15" r="1.3" fill="currentColor"/><circle cx="9" cy="3" r="1.3" fill="currentColor"/><circle cx="17" cy="7" r="1.3" fill="currentColor"/></svg></button>
      <button type="button" data-tool="circle" title="Круг: новая часть (C)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="1.2" fill="currentColor"/></svg></button>
      <button type="button" data-tool="ngon" title="Правильный многоугольник: новая часть (N)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M10 3l6.1 3.5v7L10 17l-6.1-3.5v-7z"/><circle cx="10" cy="10" r="1.2" fill="currentColor"/></svg></button>
      <button type="button" data-tool="offset" title="Отступ: контур плоской крыши или низа (Shift) — наружу или внутрь (O)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2.5 2.5h15v15h-15z" stroke-dasharray="2.2 1.8"/><path d="M6.5 6.5h7v7h-7z"/></svg></button>
      <button type="button" data-tool="measure" title="Рулетка: расстояние между точками (T)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M2.5 13.5l11-11 4 4-11 11z"/><path d="M6 10l1.5 1.5M8.5 7.5l1.5 1.5M11 5l1.5 1.5"/></svg></button>
      <button type="button" data-tool="paint" title="Заливка: Ctrl+клик — взять цвет и материал, клик — назначить (B)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M4 7h10l-1.5 9h-7z"/><path d="M4.6 10.5h8.8l-.9 5.5h-7z" fill="currentColor" fill-opacity=".35" stroke="none"/><path d="M5.5 7a3.5 3.5 0 0 1 7 0"/><path d="M14 7.5c1.8.2 2.8 1.4 3 3"/><path d="M17 13s1.2 1.5 1.2 2.3a1.2 1.2 0 0 1-2.4 0c0-.8 1.2-2.3 1.2-2.3z" fill="currentColor"/></svg></button>
      <div class="toolbar-sep"></div>
      <button type="button" data-snaps class="active" title="Привязки включены (S)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M4 3h4v7a2 2 0 0 0 4 0V3h4v7a6 6 0 0 1-12 0z"/><path d="M4 3h4v3H4zM12 3h4v3h-4z" fill="currentColor"/></svg></button>
      <button type="button" data-help title="Помощь по инструменту (показать или скрыть)">?</button>
    </div>
  </div>
  </div>
  <div id="right-col" class="col">
  <aside id="help-panel" class="panel" hidden>
    <header class="panel-head"><h1>Помощь <span id="help-tool" class="hint"></span></h1><button type="button" class="collapse-btn" title="Свернуть" aria-expanded="true"></button></header>
    <div class="panel-body"><div id="help" class="help"></div></div>
  </aside>
  <aside id="outliner-panel" class="panel" hidden>
    <header class="panel-head"><h1>Части здания <span id="outliner-count" class="hint"></span></h1><button type="button" class="collapse-btn" title="Свернуть" aria-expanded="true"></button></header>
    <div class="panel-body"><ul id="outliner" class="outliner"></ul></div>
  </aside>
  <aside id="levels-panel" class="panel" hidden>
    <header class="panel-head"><h1>Этажи <span id="levels-count" class="hint"></span></h1><button type="button" class="collapse-btn" title="Свернуть" aria-expanded="true"></button></header>
    <div class="panel-body"><ul id="levels" class="outliner levels"></ul></div>
  </aside>
  <aside id="info-panel" class="panel">
    <header class="panel-head"><h1>Свойства</h1><button type="button" class="collapse-btn" title="Свернуть" aria-expanded="true"></button></header>
    <div class="panel-body"><div id="info"></div></div>
  </aside>
  <aside id="edits-panel" class="panel collapsed" data-auto-collapse>
    <header class="panel-head"><h1>Правки <span id="edits-count" class="hint"></span></h1>
      <span id="edits-history" class="head-tools" hidden>
        <button type="button" class="icon-btn" data-undo title="Отменить (Ctrl+Z)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 14.5C15.5 9.5 12.5 7 8.5 7.5c-1.6.2-3 .9-4.2 2"/><path d="M3.5 5.5v4.5H8"/></svg></button>
        <button type="button" class="icon-btn" data-redo title="Повторить (Ctrl+Shift+Z)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 14.5C4.5 9.5 7.5 7 11.5 7.5c1.6.2 3 .9 4.2 2"/><path d="M16.5 5.5v4.5H12"/></svg></button>
      </span>
      <button type="button" class="collapse-btn" title="Развернуть" aria-expanded="false"></button></header>
    <div class="panel-body">
      <section id="changes" hidden></section>
      <p id="account" class="account-line"></p>
    </div>
  </aside>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
