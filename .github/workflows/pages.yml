# Сборка и выкладка на GitHub Pages при каждом пуше в main.
# client_id OAuth-приложений — переменные репозитория (Settings → Secrets and variables → Actions → Variables):
# они не секретные (PKCE, без client_secret) и всё равно попадают в собранный JS.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_OSM_CLIENT_ID: ${{ vars.VITE_OSM_CLIENT_ID }}
          VITE_OSM_DEV_CLIENT_ID: ${{ vars.VITE_OSM_DEV_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
