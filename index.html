<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSM Simple 3D Editor</title>
</head>
<body>
  <div id="map"></div>
  <div id="popup"></div>
  <div id="op-indicator" hidden><span class="dot"></span><span class="label"></span><button type="button" class="retry" hidden>Повторить</button></div>
  <div id="left-col" class="col">
  <aside id="panel" class="panel">
    <header class="panel-head"><h1>OSM Simple 3D</h1><button type="button" class="collapse-btn" title="Свернуть" aria-expanded="true"></button></header>
    <div class="panel-body">
    <label class="server-line">Сервер OSM <select id="server-select" title="Откуда загружать данные для редактирования и куда отправлять"></select></label>
    <label class="toggle"><input id="mono-toggle" type="checkbox" /> Убрать цвета</label>
    <label class="toggle" title="Правая или средняя кнопка мыши, либо Ctrl + левая"><input id="orbit-toggle" type="checkbox" /> Вращение вокруг точки под курсором</label>
    <details id="gfx" class="gfx">
      <summary>Настройки графики</summary>
      <label class="toggle"><input type="checkbox" data-gfx="antialias" /> Сглаживание <span class="hint">(перезагрузит страницу)</span></label>
      <label class="toggle"><input type="checkbox" data-gfx="hemisphere" /> Полусферический свет</label>
      <label class="toggle"><input type="checkbox" data-gfx="groundAO" /> Затемнение у земли</label>
      <label class="toggle"><input type="checkbox" data-gfx="edges" /> Контуры рёбер</label>
      <label class="toggle"><input type="checkbox" data-gfx="noGlass" /> Выключить стёкла</label>
      <p class="hint cache-line"><span id="cache-info">Кэш тайлов: —</span> <button id="cache-clear" type="button">Очистить</button></p>
      <p class="hint cache-line"><button id="tiles-reload" type="button" title="Отладка: заново запросить из Overpass тайлы на экране">Перезагрузить видимые тайлы</button></p>
      <p id="perf" class="hint">FPS: — · треугольников: —</p>
    </details>
    <p id="status" class="hint">Приблизьте карту (z ≥ 15) и кликните по зданию.</p>
    </div>
  </aside>
  <!-- Вертикальные панели инструментов (режим здания и др.) -->
  <div id="toolbars">
    <div id="focus-tools" class="toolbar" hidden>
      <button type="button" data-tool="move" title="Переместить (M)">✥</button>
      <button type="button" data-tool="push" title="Вытянуть: высота верха или низа (P)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M3 13l7 3.5 7-3.5-7-3.5z"/><path d="M10 9.5V2.5M7.5 5L10 2.5 12.5 5"/></svg></button>
      <button type="button" data-tool="split" title="Рассечь верхнюю грань (K)"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M3 5h14v10H3z"/><path d="M8 3.5l4 13" stroke-dasharray="2 1.6"/></svg></button>
    </div>
  </div>
  </div>
  <div id="right-col" class="col">
  <aside id="outliner-panel" class="panel" hidden>
    <header class="panel-head"><h1>Части здания <span id="outliner-count" class="hint"></span></h1><button type="button" class="collapse-btn" title="Свернуть" aria-expanded="true"></button></header>
    <div class="panel-body"><ul id="outliner" class="outliner"></ul></div>
  </aside>
  <aside id="info-panel" class="panel">
    <header class="panel-head"><h1>Свойства</h1><button type="button" class="collapse-btn" title="Свернуть" aria-expanded="true"></button></header>
    <div class="panel-body"><div id="info"></div></div>
  </aside>
  <aside id="edits-panel" class="panel collapsed" data-auto-collapse>
    <header class="panel-head"><h1>Правки <span id="edits-count" class="hint"></span></h1>
      <span id="edits-history" class="head-tools" hidden>
        <button type="button" class="icon-btn" data-undo title="Отменить (Ctrl+Z)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 14.5C15.5 9.5 12.5 7 8.5 7.5c-1.6.2-3 .9-4.2 2"/><path d="M3.5 5.5v4.5H8"/></svg></button>
        <button type="button" class="icon-btn" data-redo title="Повторить (Ctrl+Shift+Z)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 14.5C4.5 9.5 7.5 7 11.5 7.5c1.6.2 3 .9 4.2 2"/><path d="M16.5 5.5v4.5H12"/></svg></button>
      </span>
      <button type="button" class="collapse-btn" title="Развернуть" aria-expanded="false"></button></header>
    <div class="panel-body">
      <section id="changes" hidden></section>
      <p id="account" class="account-line"></p>
    </div>
  </aside>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
