<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSM Simple 3D Editor</title>
</head>
<body>
  <div id="map"></div>
  <div id="op-indicator" hidden><span class="dot"></span><span class="label"></span></div>
  <aside id="panel">
    <h1>OSM Simple 3D</h1>
    <button id="edit-btn" type="button" disabled>Редактировать область</button>
    <label class="toggle"><input id="mono-toggle" type="checkbox" /> Убрать цвета</label>
    <label class="toggle" title="Правая или средняя кнопка мыши, либо Ctrl + левая"><input id="orbit-toggle" type="checkbox" /> Вращение вокруг точки под курсором</label>
    <details id="gfx" class="gfx">
      <summary>Настройки графики</summary>
      <label class="toggle"><input type="checkbox" data-gfx="antialias" /> Сглаживание <span class="hint">(перезагрузит страницу)</span></label>
      <label class="toggle"><input type="checkbox" data-gfx="hemisphere" /> Полусферический свет</label>
      <label class="toggle"><input type="checkbox" data-gfx="groundAO" /> Затемнение у земли</label>
      <label class="toggle"><input type="checkbox" data-gfx="edges" /> Контуры рёбер</label>
      <p class="hint cache-line"><span id="cache-info">Кэш тайлов: —</span> <button id="cache-clear" type="button">Очистить</button></p>
      <p id="perf" class="hint">FPS: — · треугольников: —</p>
    </details>
    <p id="status" class="hint">Приблизьте карту (z ≥ 16) и нажмите «Редактировать область».</p>
    <div id="info"></div>
    <section id="changes" hidden></section>
  </aside>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
