<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSM Simple 3D Editor</title>
</head>
<body>
  <div id="map"></div>
  <div id="op-indicator" hidden><span class="dot"></span><span class="label"></span></div>
  <aside id="panel">
    <h1>OSM Simple 3D</h1>
    <button id="edit-btn" type="button" disabled>Редактировать область</button>
    <button id="merged-btn" type="button" class="secondary" disabled>Скрыть перекрытые склеенные</button>
    <p id="status" class="hint">Приблизьте карту (z ≥ 16) и нажмите «Редактировать область».</p>
    <div id="info"></div>
  </aside>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
